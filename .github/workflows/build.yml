name: Build & Release APK

on:
  push:
    branches: [ main, master, "arena/**" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "APK বিল্ড শেষে GitHub Release-এ আপলোড করবে?"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # AGP 9.1.1 compiles against API 36.1; make sure the SDK packages are
      # present even on runner images that ship them several revisions behind.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(command -v sdkmanager || true)
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --install "platforms;android-36.1" "build-tools;36.0.0" \
              || echo "::warning title=SDK install::sdkmanager could not install the extra packages, Gradle will fetch them itself."
          else
            echo "::warning title=SDK install::sdkmanager not found, relying on Gradle's automatic SDK download."
          fi

      - name: Build debug + signed release APK
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      # Reads the version out of the built APK, fails if the release APK is not
      # correctly signed, checks that it can update the previous release, and
      # copies the APKs to dist/ under their release names.
      - name: Verify APK (signature, version, update from previous release)
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-apk.sh

      # dist/release-notes.md = CHANGELOG.md section of this version + APK facts.
      - name: Write release notes
        run: bash .github/scripts/release-notes.sh

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: HscGuide-release-apk
          path: dist/HscGuide-v*-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: HscGuide-debug-apk
          path: dist/HscGuide-v*-debug.apk
          if-no-files-found: error
          retention-days: 90

      # Publish a release on pushes to the main branch, or on a manual run with
      # "publish_release" enabled. Never from pull requests.
      #
      # The tag is "v<versionName>" as read from the APK, and it is created at
      # the exact commit that was built (target_commitish), so the release can
      # be verified from a branch before that branch is merged into main.
      # Re-running the same version later overwrites the APK assets of the tag.
      - name: Publish GitHub Release
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           (github.event_name == 'workflow_dispatch' && inputs.publish_release))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HSC Guide ${{ steps.apk.outputs.tag }}
          body_path: dist/release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/HscGuide-${{ steps.apk.outputs.tag }}-release.apk
            dist/HscGuide-${{ steps.apk.outputs.tag }}-debug.apk
            dist/HscGuide-release.apk
            dist/HscGuide-debug.apk
